# Production: main domain + auth subdomain.
#
# Sits BEHIND CloudPanel (the CloudPanel vhost terminates TLS and reverse-proxies
# here over plain HTTP). This server listens on :4568 and routes by the Host
# header that CloudPanel passes through:
#   openloan.m4rkus28.de       -> frontend + backend API
#   auth.openloan.m4rkus28.de  -> keycloak

# Main app (frontend + backend API)
server {
    listen 4568;
    server_name openloan.m4rkus28.de;

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # MCP (Model Context Protocol) endpoint — JSON-RPC over Streamable HTTP
    location /mcp {
        proxy_pass http://backend:8000/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_buffering off;          # stream responses straight through
        proxy_read_timeout 300s;
    }

    # MinIO presigned URL passthrough (uploads go direct to MinIO)
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend (SPA — serve index.html for all unknown paths)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    location @spa_fallback {
        # nginx forbids a URI part in proxy_pass inside a named location,
        # so set the URI via rewrite, then proxy without one.
        rewrite ^ /index.html break;
        proxy_pass http://frontend:80;
    }
}

# Keycloak subdomain
server {
    listen 4568;
    server_name auth.openloan.m4rkus28.de;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
