# OpenLoan login theme — "East-meets-West editorial fintech".
# Extends the stock Keycloak login theme (PatternFly markup stays intact) and
# layers an on-brand stylesheet on top so Sign in / Sign up match the SPA.
parent=keycloak
import=common/keycloak

# Keep PatternFly's base (stylesCommon is inherited from the parent) and the
# stock login.css, then append our override last so it wins the cascade.
styles=css/login.css css/openloan.css
