# Dev overrides — hot reload, exposed ports, debug mode
services:

  postgres:
    ports:
      - "5432:5432"

  minio:
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI

  keycloak:
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_PROXY: none
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-app.json:/opt/keycloak/data/import/realm-app.json:ro
    ports:
      - "8080:8080"

  backend:
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend/src:/app/src:rw
      - ./backend/alembic:/app/alembic:rw
    environment:
      LOG_LEVEL: DEBUG
      RELOAD: "true"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:rw
      # Config files must be mounted too, otherwise the dev server keeps using
      # the copies baked into the image at build time (e.g. the Tailwind theme,
      # fonts in index.html). Without these, src/index.css can reference theme
      # classes the stale config doesn't know about.
      - ./frontend/index.html:/app/index.html:rw
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts:rw
      - ./frontend/postcss.config.js:/app/postcss.config.js:rw
      - ./frontend/vite.config.ts:/app/vite.config.ts:rw
      - ./frontend/tsconfig.json:/app/tsconfig.json:rw
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json:rw
      # avoid overwriting node_modules inside container
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api/v1
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: app
      VITE_KEYCLOAK_CLIENT_ID: app-frontend

  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
